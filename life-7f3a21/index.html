:root {
  --bg:          #0E0E0E;
  --surface-1:   #1A1A1D;
  --surface-2:   #1F1F22;
  --surface-3:   #2A2A2D;
  --line:        #2A2A2D;
  --line-soft:   #1F1F22;

  --ink:         #FFFFFF;
  --ink-2:       #ABABAB;
  --ink-3:       #5F5F5F;

  --accent:      #F8B815;
  --accent-ink:  #0E0E0E;
  --accent-soft: rgba(248, 184, 21, 0.12);
  --accent-line: rgba(248, 184, 21, 0.34);

  --down:        #EA4A3F;
  --down-soft:   rgba(234, 74, 63, 0.14);
  --down-line:   rgba(234, 74, 63, 0.38);

  --up:          #3FBF6F;
  --up-soft:     rgba(63, 191, 111, 0.16);

  --font-display: 'Manrope', system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body:    'Onest', system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num:     var(--font-display);

  --r-s: 10px;
  --r-m: 14px;
  --r-l: 20px;
  --tap: 44px;
  --pad: 16px;

  --t-tap:   180ms;
  --t-quick: 320ms;
  --t-move:  480ms;

  --ease: cubic-bezier(.4, .15, .2, 1);

  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  color-scheme: dark;
}

* { box-sizing: border-box; }

html {
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}

/* clip, а не hidden: hidden делает элемент контейнером прокрутки и ломает
   прилипание шапки — она уезжает вместе со страницей. */
html, body { overflow-x: clip; touch-action: manipulation; }

body {
  margin: 0;
  padding: 0 0 calc(64px + var(--safe-bottom));
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(248,184,21,0.05), transparent 60%),
    var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 400;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

::selection { background: var(--accent); color: var(--accent-ink); }
strong, b { font-weight: 500; }

.wrap { max-width: 720px; margin: 0 auto; padding: 0 var(--pad); }

/* ─────────────────────────── замок ─────────────────────────── */

.lock {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 24px;
  background: var(--bg);
  z-index: 50;
}
.lock__mark { color: var(--accent); }
.lock__title { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 0; }
.lock__hint { color: var(--ink-3); font-size: 14px; margin: 0; text-align: center; max-width: 280px; }
.lock__form { display: flex; gap: 8px; width: 100%; max-width: 320px; }
.lock__input {
  flex: 1;
  min-height: var(--tap);
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  background: var(--surface-1);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
}
.lock__input:focus { outline: none; border-color: var(--accent-line); }
.lock__btn {
  min-height: var(--tap);
  padding: 0 18px;
  border: 0;
  border-radius: var(--r-s);
  background: var(--accent);
  color: var(--accent-ink);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
}
.lock__error { color: var(--down); font-size: 14px; min-height: 20px; margin: 0; }
.lock[hidden] { display: none; }

/* ─────────────────────────── шапка ─────────────────────────── */

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  padding-top: var(--safe-top);
  background: rgba(14,14,14,0.92);
  backdrop-filter: saturate(140%) blur(12px);
  border-bottom: 1px solid var(--line-soft);
}
.topbar__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  max-width: 720px;
  margin: 0 auto;
  padding: 12px var(--pad) 10px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand__mark {
  display: grid;
  place-items: center;
  width: 34px; height: 34px;
  border-radius: var(--r-s);
  background: var(--accent-soft);
  color: var(--accent);
  overflow: hidden;
}
.brand__mark:has(.brand__ava) { border-radius: 50%; background: none; }
.brand__ava { width: 100%; height: 100%; display: block; object-fit: cover; border-radius: 50%; }
.brand__title { display: block; font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.1; }
.brand__sub { display: block; color: var(--ink-3); font-size: 12px; }

/* Состояние связи со шлюзом: горит, когда движок на компьютере отвечает.
   Точка, а не слово: строка «связь есть» отнимала бы место у названия. */
.link-state { display: flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 11px; text-align: right; line-height: 1.25; }
.link-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: 0 0 auto; }
.link-state.is-live .link-dot { background: var(--up); }
.link-state.is-live { color: var(--ink-2); }
.link-state.is-sending .link-dot { background: var(--accent); animation: pulse 1s var(--ease) infinite; }
@keyframes pulse { 50% { opacity: .3; } }

.tabs { max-width: 720px; margin: 0 auto; }
.tabs__scroll {
  display: flex;
  gap: 6px;
  padding: 0 var(--pad) 10px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs__scroll::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--ink-2);
  font-size: 14px;
  text-decoration: none;
  transition: color var(--t-tap) var(--ease), border-color var(--t-tap) var(--ease), background var(--t-tap) var(--ease);
}
.tab.is-active { background: var(--surface-3); border-color: var(--surface-3); color: var(--ink); }

/* ─────────────────────────── разделы ─────────────────────────── */

.section { display: none; padding-top: 18px; }
.section.is-active { display: block; animation: appear var(--t-move) var(--ease) both; }
@keyframes appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.h2 {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 26px 0 10px;
}
.h2__side { font-family: var(--font-body); letter-spacing: 0; text-transform: none; font-weight: 400; font-size: 12px; }
.section > .h2:first-child { margin-top: 0; }

.daydate {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 22px;
  margin: 0 0 14px;
}
.daydate::first-letter { text-transform: uppercase; }

.note { margin: 10px 2px 0; font-size: 13px; color: var(--ink-3); }
.empty { margin: 0; padding: 18px var(--pad); border: 1px dashed var(--line); border-radius: var(--r-m); color: var(--ink-3); font-size: 14px; }
.empty--tight { padding: 8px 0; border: 0; font-size: 13px; }

/* ─────────────────────────── три цифры ─────────────────────────── */

.tiles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  overflow: hidden;
}
.tile { background: var(--surface-1); padding: 14px var(--pad); }
/* Третья цифра встаёт полосой под парой: в три колонки числа ломались бы
   переносом, а места под ними хватает. */
.tile--wide { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tile--wide .tile__label { margin-bottom: 2px; }
.tile--wide .tile__note { margin: 0; }
.tile__label { display: block; font-size: 12px; color: var(--ink-3); margin-bottom: 4px; }
.tile__value { display: block; font-family: var(--font-num); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile__note { display: block; font-size: 11px; color: var(--ink-3); margin-top: 4px; line-height: 1.3; }

/* ─────────────────────────── строки ─────────────────────────── */

.rows { border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; background: var(--surface-1); }
.row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 14px;
  padding: 14px var(--pad);
  border-top: 1px solid var(--line-soft);
}
.row:first-child { border-top: 0; }
.row__label { font-size: 15px; color: var(--ink-2); }
.row__note { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.row__value {
  font-family: var(--font-num);
  font-weight: 600;
  font-size: 18px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.row__when { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.row--plain .row__label { color: var(--ink); }
.row--sub { padding: 11px var(--pad); }
.row--sub .row__label { font-size: 14px; }
.row--sub .row__value { font-size: 15px; color: var(--ink); }
.row--lead { padding: 18px var(--pad); }
.row--lead .row__value { font-size: 26px; }
.row--down .row__value { color: var(--down); }
.row__none { font-family: var(--font-body); font-weight: 400; font-size: 13px; color: var(--ink-3); }
.row--link { color: inherit; text-decoration: none; }
.row--link .row__when { color: var(--ink-3); }

/* ─────────────────────────── задачи ─────────────────────────── */

.group {
  margin: 16px 2px 6px;
  font-size: 12px;
  color: var(--ink-3);
}
.tasks { border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; background: var(--surface-1); }

.task {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px var(--pad);
  border-top: 1px solid var(--line-soft);
}
.task:first-child { border-top: 0; }
/* Квадрат отметки — цель касания на всю высоту строки: попасть пальцем
   в 22 пикселя на ходу невозможно, а отмечают задачи именно на ходу. */
.task__box {
  flex: 0 0 auto;
  width: 22px; height: 22px;
  margin-top: 1px;
  padding: 0;
  border: 1.5px solid var(--ink-3);
  border-radius: 7px;
  background: none;
  cursor: pointer;
  position: relative;
  transition: border-color var(--t-tap) var(--ease), background var(--t-tap) var(--ease);
}
.task__box::before {
  content: '';
  position: absolute;
  inset: -11px -8px;
}
.task__box::after {
  content: '';
  position: absolute;
  left: 6px; top: 2px;
  width: 6px; height: 11px;
  border-right: 2px solid var(--accent-ink);
  border-bottom: 2px solid var(--accent-ink);
  transform: rotate(45deg) scale(0);
  transition: transform var(--t-tap) var(--ease);
}
.task.is-done .task__box { background: var(--up); border-color: var(--up); }
.task.is-done .task__box::after { transform: rotate(45deg) scale(1); }
.task__body { min-width: 0; }
.task__title { display: block; font-size: 15px; line-height: 1.35; }
.task__meta { display: block; font-size: 12px; color: var(--ink-3); margin-top: 3px; }
.task.is-done .task__title { color: var(--ink-3); text-decoration: line-through; }
.task.is-key .task__title { font-weight: 500; }
/* Ключевая задача — единственное место жёлтого на экране. */
.task.is-key .task__box { border-color: var(--accent); }
.task__late { color: var(--down); }
.task.is-pending { opacity: .55; }

/* ─────────────────────────── привычки ─────────────────────────── */

.habits { display: flex; gap: 8px; }
.habit {
  flex: 1 1 0;
  min-width: 0;
  height: var(--tap);
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  background: var(--surface-1);
  color: var(--ink-3);
  font-family: var(--font-body);
  font-size: 12px;
  cursor: pointer;
  transition: background var(--t-tap) var(--ease), color var(--t-tap) var(--ease), border-color var(--t-tap) var(--ease);
}
.habit.is-done { background: var(--up-soft); border-color: rgba(63,191,111,0.4); color: var(--up); }
.habit__short { display: block; }

/* Сетка недели: строка на привычку, семь клеток. */
.hgrid { border: 1px solid var(--line); border-radius: var(--r-l); background: var(--surface-1); padding: 10px var(--pad) 12px; }
.hgrid__row { display: flex; align-items: center; gap: 6px; padding: 5px 0; }
.hgrid__name { flex: 1 1 auto; min-width: 0; font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hgrid__cap { flex: 0 0 22px; text-align: center; font-size: 11px; color: var(--ink-3); }
.hgrid__cap.is-today { color: var(--ink); }
.hgrid__row--head { padding-bottom: 2px; }
.cell { flex: 0 0 22px; height: 22px; border-radius: 6px; background: var(--surface-3); }
.cell.is-done { background: var(--up); }
.cell.is-miss { background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--down-line); }
.cell.is-future { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }

/* ─────────────────────────── дни недели ─────────────────────────── */

.days { display: grid; gap: 10px; }
.day { border: 1px solid var(--line); border-radius: var(--r-l); background: var(--surface-1); padding: 12px var(--pad) 6px; }
.day.is-today { border-color: var(--accent-line); }
.day.is-past { opacity: .72; }
.day__head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 6px; }
.day__name { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.day__count { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.day__plan { margin: 0 0 8px; font-size: 12px; color: var(--ink-3); }
.day .tasks { border: 0; border-radius: 0; background: none; }
.day .task { padding: 10px 0; }

/* ─────────────────────────── раскрывающееся ─────────────────────────── */

details.fold {
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  background: var(--surface-1);
  margin-top: 12px;
  overflow: hidden;
}
.fold > summary {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: var(--tap);
  padding: 12px var(--pad);
  cursor: pointer;
  list-style: none;
  font-size: 15px;
}
.fold > summary::-webkit-details-marker { display: none; }
.fold__side { margin-left: auto; color: var(--ink-3); font-size: 13px; }
.fold > summary::after {
  content: '';
  width: 8px; height: 8px;
  border-right: 1.5px solid var(--ink-3);
  border-bottom: 1.5px solid var(--ink-3);
  transform: rotate(45deg) translate(-2px, -2px);
  transition: transform var(--t-quick) var(--ease);
  flex: 0 0 auto;
}
.fold[open] > summary::after { transform: rotate(-135deg) translate(-2px, -2px); }
.fold__body { padding: 2px var(--pad) 12px; border-top: 1px solid var(--line-soft); }
.fold__body .tasks { border: 0; background: none; }

/* ─────────────────────────── цели ─────────────────────────── */

.goals { display: grid; gap: 8px; }
.goal { border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface-1); padding: 14px var(--pad); }
.goal.is-done { opacity: .6; }
.goal__title { margin: 0; font-size: 15px; line-height: 1.35; }
.goal.is-done .goal__title { text-decoration: line-through; }
.goal__metric { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); }
.goal__foot { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 8px 0 0; font-size: 12px; color: var(--ink-3); }
.goal__status { color: var(--ink-2); }
.goal__deadline { margin-left: auto; }

/* ─────────────────────────── долги ─────────────────────────── */

.debts { border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; background: var(--surface-1); }
.debt {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 12px var(--pad);
  border-top: 1px solid var(--line-soft);
}
.debt:first-child { border-top: 0; }
.debt.is-urgent { background: var(--down-soft); }
.debt__body { min-width: 0; }
.debt__who { display: block; font-size: 15px; }
.debt__queue {
  display: inline-grid;
  place-items: center;
  width: 20px; height: 20px;
  margin-right: 8px;
  border-radius: 6px;
  background: var(--surface-3);
  color: var(--ink-2);
  font-family: var(--font-num);
  font-weight: 600;
  font-size: 11px;
  vertical-align: 1px;
}
.debt__meta { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.debt__sum { font-family: var(--font-num); font-weight: 600; font-size: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.debt__paid { display: block; font-family: var(--font-body); font-weight: 400; font-size: 11px; color: var(--ink-3); }

/* ─────────────────────────── чат ─────────────────────────── */

/* Переписка занимает экран целиком, а строка ввода прижата к низу:
   до неё должен доставать большой палец, не меняя хвата. */
.section--chat { display: none; }
.section--chat.is-active { display: flex; flex-direction: column; min-height: calc(100vh - 150px); }
.chat { flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px; }
.msg { max-width: 86%; padding: 11px 14px; border-radius: var(--r-m); font-size: 15px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg--me { align-self: flex-end; background: var(--surface-3); border-bottom-right-radius: 4px; }
.msg--bot { align-self: flex-start; background: var(--surface-1); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg--sys { align-self: center; background: none; color: var(--ink-3); font-size: 12px; padding: 2px 0; }
.msg__time { display: block; margin-top: 5px; font-size: 11px; color: var(--ink-3); }
.msg.is-pending { opacity: .55; }
.msg__ops { display: block; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line-soft); font-size: 12px; color: var(--ink-2); }

.chat__dock {
  position: sticky;
  bottom: 0;
  padding: 8px 0 calc(8px + var(--safe-bottom));
  background: linear-gradient(to top, var(--bg) 70%, rgba(14,14,14,0));
}
.chat__state { min-height: 16px; margin: 0 4px 4px; font-size: 12px; color: var(--ink-3); }
.chat__form { display: flex; align-items: center; gap: 8px; }
.chat__input {
  flex: 1 1 auto;
  min-width: 0;
  min-height: var(--tap);
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface-1);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
}
.chat__input:focus { outline: none; border-color: var(--accent-line); }
.chat__mic, .chat__send {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: var(--tap); height: var(--tap);
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--surface-1);
  color: var(--ink-2);
  cursor: pointer;
  transition: background var(--t-tap) var(--ease), color var(--t-tap) var(--ease), border-color var(--t-tap) var(--ease);
}
.chat__send { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chat__mic.is-recording { background: var(--down); border-color: var(--down); color: #fff; animation: pulse 1.1s var(--ease) infinite; }

.foot { margin: 34px 0 10px; color: var(--ink-3); font-size: 13px; }
.foot p { margin: 0 0 8px; }
.foot a { color: inherit; }

@media (min-width: 560px) {
  .row__value { font-size: 20px; }
  .row--lead .row__value { font-size: 30px; }
  .tile__value { font-size: 24px; }
}
</style>
</head>

<script>(function(){
/**
 * Движок приложения «Ассистент»: снимок «Моей жизни» → то, что видно на экране.
 *
 * Один вход и один выход: `buildModel(snapshot, manual, today)`. Снимок
 * снимается `tools/snapshot.py` из Notion, ручные настройки лежат
 * в `data/manual.json`. Ни одного обращения к сети здесь нет — поэтому
 * весь показ проверяется тестами на записанном снимке.
 *
 * Модель уезжает в страницу зашифрованной и рисуется на устройстве
 * (`src/view.js`). Это отличие от приложения «Деньги», где внутрь шифротекста
 * кладётся готовая разметка: там страница — снимок на момент сборки, а здесь
 * экран живой. Он перерисовывается свежими данными от шлюза, отмечает галочки
 * и ведёт переписку, а значит данные нужны ему как данные, а не как HTML.
 */

const WEEKDAYS = ['понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота', 'воскресенье'];
const WEEKDAYS_SHORT = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
  'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

/* ─────────────────────────── числа и даты ─────────────────────────── */

/** Сумма по-русски: разряды неразрывным пробелом, копейки только если они есть. */
function RUB(n) {
  const v = Math.round((n || 0) * 100) / 100;
  const whole = Math.trunc(Math.abs(v));
  const cents = Math.round((Math.abs(v) - whole) * 100);
  const head = String(whole).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  const sign = v < 0 ? '−' : '';
  return `${sign}${head}${cents ? ',' + String(cents).padStart(2, '0') : ''} ₽`;
}

/** Только число, без знака рубля — для «12 задач» и подписей. */
function NUM(n) {
  return String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

/** Та же сумма без копеек — для плиток и итогов. Копейки нужны там, где
 *  сверяются с кредитором построчно; в цифре «сколько всего должен» они
 *  только мешают прочитать порядок за секунду. */
function RUB0(n) {
  return RUB(Math.round(n || 0));
}

function plural(n, one, few, many) {
  const a = Math.abs(Math.round(n)) % 100;
  const b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

/** ISO-дата → Date в местном поясе. Через `new Date(iso)` вышел бы UTC,
 *  и у дат до полудня день уезжал бы на предыдущий. */
function parseISO(iso) {
  const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number);
  return new Date(y, (m || 1) - 1, d || 1);
}

function toISO(date) {
  const p = (n) => String(n).padStart(2, '0');
  return `${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}`;
}

function addDays(iso, days) {
  const d = parseISO(iso);
  d.setDate(d.getDate() + days);
  return toISO(d);
}

/** Индекс дня недели с понедельника: 0 — пн, 6 — вс. */
function weekdayIndex(iso) {
  return (parseISO(iso).getDay() + 6) % 7;
}

function weekStart(iso) {
  return addDays(iso, -weekdayIndex(iso));
}

function humanDate(iso, { withWeekday = false } = {}) {
  const d = parseISO(iso);
  const base = `${d.getDate()} ${MONTHS[d.getMonth()]}`;
  return withWeekday ? `${WEEKDAYS[weekdayIndex(iso)]}, ${base}` : base;
}

/** «сегодня», «завтра», «в пятницу» — как это называет человек, а не календарь. */
function relativeDay(iso, today) {
  if (iso === today) return 'сегодня';
  if (iso === addDays(today, 1)) return 'завтра';
  if (iso === addDays(today, -1)) return 'вчера';
  const diff = Math.round((parseISO(iso) - parseISO(today)) / 86400000);
  // «в среду», «в пятницу»: винительный падеж собирается из именительного —
  // все семь названий заканчиваются на «а», «е» или согласную.
  if (diff > 1 && diff < 7) {
    const name = WEEKDAYS[weekdayIndex(iso)];
    const acc = name.endsWith('а') ? name.slice(0, -1) + 'у' : name;
    return `в ${acc}`;
  }
  if (diff < 0) {
    const ago = -diff;
    return `${humanDate(iso)}, ${ago} ${plural(ago, 'день', 'дня', 'дней')} назад`;
  }
  return humanDate(iso);
}

/* ─────────────────────────── типографика ─────────────────────────── */

const SHORT = 'для|над|под|при|про|без|или|как|что|чем|уже|ещё|его|её|их|там|где|это|все|всё';

/**
 * Предлоги и короткие слова не остаются на конце строки.
 *
 * Пробел здесь именно неразрывный, заданный кодом символа. Записанный
 * буквой он выглядит в исходнике как обычный, и при первом же копировании
 * строки правило превращается в пустую операцию: в соседнем приложении
 * «Деньги» типографика ровно так и не работает.
 */
function fixText(text) {
  let s = String(text == null ? '' : text);
  for (let i = 0; i < 2; i++) {
    s = s.replace(
      new RegExp(`(^|[\\s(«"—-])((?:[А-Яа-яЁёA-Za-z]{1,2}|${SHORT}))\\s+`, 'g'),
      (m, pre, w) => `${pre}${w} `
    );
  }
  // Сумма не отрывается от знака рубля, а число — от единицы.
  s = s.replace(/(\d)\s+(₽|%|год|года|лет|дней|дня|день|раз)/g, '$1 $2');
  s = s.replace(/\s+—/g, ' —');
  return s;
}

/* ─────────────────────────── задачи ─────────────────────────── */

const KEY = 'Ключевая дня';

/** Задача в том виде, в каком её показывает экран. */
function task(t, today) {
  const overdue = Boolean(t.date) && !t.done && t.date < today;
  return {
    id: t.id,
    title: t.title,
    done: Boolean(t.done),
    date: t.date || '',
    key: t.priority === KEY,
    later: t.priority === 'Потом',
    note: t.note || '',
    project: t.project || '',
    direction: t.direction || '',
    overdue,
    // Просроченная задача считается сегодняшней: у Никиты «перенеслось»
    // не значит «отменилось», иначе она пропадает с экрана и всплывает
    // только на воскресном разборе.
    forToday: !t.done && Boolean(t.date) && t.date <= today,
  };
}

/**
 * Порядок задач дня. Сначала ключевые, потом просроченные (чем дольше висит,
 * тем выше), потом остальные. Внутри группы — по проекту, чтобы соседние
 * строки читались одним блоком.
 */
function orderTasks(list) {
  const rank = (t) => (t.key ? 0 : t.overdue ? 1 : 2);
  return [...list].sort((a, b) =>
    rank(a) - rank(b)
    || (a.date || '9999').localeCompare(b.date || '9999')
    || (a.project || 'яя').localeCompare(b.project || 'яя')
    || a.title.localeCompare(b.title));
}

/** Группировка по проекту: заголовок ставится только там, где под ним
 *  больше одной задачи. Одиночные собираются в «Остальное» — правило
 *  против частокола заголовков. */
function groupByProject(tasks) {
  const map = new Map();
  for (const t of tasks) {
    const key = t.project || t.direction || '';
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(t);
  }
  const groups = [];
  const rest = [];
  for (const [name, items] of map) {
    if (name && items.length > 1) groups.push({ name, items });
    else rest.push(...items);
  }
  groups.sort((a, b) => b.items.length - a.items.length || a.name.localeCompare(b.name));
  if (rest.length) groups.push({ name: '', items: orderTasks(rest) });
  return groups;
}

/* ─────────────────────────── привычки ─────────────────────────── */

/**
 * Привычки за неделю: строка на привычку, семь клеток.
 *
 * Клетка будущего дня — не «не сделано», а «ещё не наступило»: это разные
 * вещи, и красить их одинаково значит врать. Дни без записи в дневнике
 * тоже пустые, а не проваленные.
 */
function habitsWeek(diary, manual, weekStartISO, today) {
  const byDate = new Map(diary.map((d) => [d.date, d]));
  const names = manual.habits.map((h) => h.field);
  return {
    labels: manual.habits.map((h) => ({ field: h.field, short: h.short, title: h.title || h.field })),
    days: Array.from({ length: 7 }, (_, i) => {
      const iso = addDays(weekStartISO, i);
      const rec = byDate.get(iso);
      return {
        iso,
        short: WEEKDAYS_SHORT[i],
        isToday: iso === today,
        future: iso > today,
        filled: Boolean(rec),
        marks: names.map((n) => (rec ? Boolean(rec.habits[n]) : false)),
      };
    }),
  };
}

/** Привычки одного дня — то, что видно на экране «Сегодня». */
function habitsDay(diary, manual, iso) {
  const rec = diary.find((d) => d.date === iso);
  const items = manual.habits.map((h) => ({
    field: h.field,
    short: h.short,
    title: h.title || h.field,
    done: rec ? Boolean(rec.habits[h.field]) : false,
  }));
  return {
    iso,
    filled: Boolean(rec),
    items,
    done: items.filter((i) => i.done).length,
    total: items.length,
  };
}

/* ─────────────────────────── деньги, которые ведёт ассистент ─────────────── */

/** Долги: открытые, в порядке очереди погашения. Остаток берётся из Notion,
 *  а если формулы там нет — считается сам, но никогда не отрицательным. */
function debtsModel(debts) {
  const open = debts.filter((d) => !d.closed);
  const withLeft = open.map((d) => ({
    ...d,
    leftSum: Math.max(0, d.left != null && d.left !== '' ? Number(d.left) : (d.sum || 0) - (d.paid || 0)),
  }));
  withLeft.sort((a, b) => (a.queue == null ? 99 : a.queue) - (b.queue == null ? 99 : b.queue)
    || b.leftSum - a.leftSum);

  const groups = new Map();
  for (const d of withLeft) {
    const g = d.group || d.type || 'Прочее';
    if (!groups.has(g)) groups.set(g, { name: g, sum: 0, count: 0 });
    const rec = groups.get(g);
    rec.sum += d.leftSum;
    rec.count += 1;
  }

  return {
    items: withLeft,
    total: withLeft.reduce((s, d) => s + d.leftSum, 0),
    paid: open.reduce((s, d) => s + (d.paid || 0), 0),
    groups: [...groups.values()].sort((a, b) => b.sum - a.sum),
    urgent: withLeft.filter((d) => d.status === 'Арест счёта' || d.status === 'Исполнительное производство'),
    next: withLeft[0] || null,
  };
}

/** Ожидаемые деньги: только то, чего ещё ждут. Полученное и отменившееся
 *  в сумму не идёт — иначе цифра «жду» перестаёт быть обязательством. */
function expectModel(expect, today) {
  const open = expect.filter((e) => e.status === 'Ждём' || e.status === 'Просрочено');
  const items = open.map((e) => ({
    ...e,
    late: e.status === 'Просрочено' || (Boolean(e.promised) && e.promised < today),
  })).sort((a, b) => Number(b.late) - Number(a.late) || (b.sum || 0) - (a.sum || 0));
  return {
    items,
    total: items.reduce((s, e) => s + (e.sum || 0), 0),
    late: items.filter((e) => e.late),
  };
}

/* ─────────────────────────── цели ─────────────────────────── */

const HORIZONS = ['Этот месяц', 'Осень 2026', 'Год', '1–2 года'];

function goalsModel(goals) {
  const alive = goals.filter((g) => g.status !== 'Отложена');
  const groups = [];
  for (const h of HORIZONS) {
    const items = alive.filter((g) => g.horizon === h);
    if (items.length) {
      groups.push({
        horizon: h,
        items: items.sort((a, b) =>
          Number(b.status === 'В работе') - Number(a.status === 'В работе')
          || a.title.localeCompare(b.title)),
        done: items.filter((g) => g.status === 'Достигнута').length,
      });
    }
  }
  // Цель с горизонтом не из списка молча выпала бы с экрана целиком.
  // Пусть лучше сборка об этом скажет.
  const orphans = alive.filter((g) => !HORIZONS.includes(g.horizon));
  return { groups, orphans, total: alive.length };
}

/* ─────────────────────────── расписание дня ─────────────────────────── */

function scheduleFor(manual, iso, { withBlocks = true } = {}) {
  const idx = weekdayIndex(iso);
  const day = (manual.schedule && manual.schedule[String(idx)]) || [];
  // Постоянные блоки буднего дня печатаются один раз — на «Сегодня».
  // В неделе они стояли под каждым из пяти дней и превращали список
  // событий в шум, из которого не видно, чем вторник отличается от среды.
  const blocks = withBlocks && idx < 5 ? (manual.workdayBlocks || []) : [];
  return [...day, ...blocks];
}

/* ─────────────────────────── сборка ─────────────────────────── */

function buildModel(snapshot, manual, todayISO) {
  const today = todayISO || snapshot.date;
  const start = weekStart(today);
  const end = addDays(start, 6);

  const tasks = snapshot.tasks.map((t) => task(t, today));
  const open = tasks.filter((t) => !t.done);

  const todayTasks = orderTasks(open.filter((t) => t.forToday));
  const meetings = snapshot.meetings
    .filter((m) => m.date && m.date >= today && m.status === 'Назначена')
    .sort((a, b) => a.date.localeCompare(b.date));

  const debts = debtsModel(snapshot.debts);
  const expect = expectModel(snapshot.expect, today);
  const habitsToday = habitsDay(snapshot.diary, manual, today);

  const weekDays = Array.from({ length: 7 }, (_, i) => {
    const iso = addDays(start, i);
    const dayTasks = tasks.filter((t) => t.date === iso);
    return {
      iso,
      name: WEEKDAYS[i],
      short: WEEKDAYS_SHORT[i],
      isToday: iso === today,
      past: iso < today,
      schedule: scheduleFor(manual, iso, { withBlocks: false }),
      tasks: orderTasks(dayTasks),
      done: dayTasks.filter((t) => t.done).length,
      total: dayTasks.length,
    };
  });

  const marked = todayTasks.filter((t) => t.key);
  const keyOfDay = (marked.length ? marked : todayTasks).slice(0, 3);

  const undated = orderTasks(open.filter((t) => !t.date && !t.later));
  const later = orderTasks(open.filter((t) => !t.date && t.later));

  // Цифры на главном экране. Их ровно три и все — обязательства: сколько
  // должен, сколько ждёт прихода, сколько задач стоит на сегодня.
  // Агрегаты вроде «денег в работе по выставленным КП» сюда не ставятся:
  // за такую плитку уже прилетало — выставленное КП это не деньги.
  const numbers = [
    { id: 'debts', label: 'Долги', value: RUB0(debts.total), note: `${debts.items.length} ${plural(debts.items.length, 'кредитор', 'кредитора', 'кредиторов')}` },
    { id: 'expect', label: 'Жду оплат', value: RUB0(expect.total), note: expect.late.length ? `${expect.late.length} просрочено` : `${expect.items.length} ${plural(expect.items.length, 'ожидание', 'ожидания', 'ожиданий')}` },
    { id: 'tasks', label: 'Задач на сегодня', value: NUM(todayTasks.length), note: todayTasks.filter((t) => t.overdue).length ? `${todayTasks.filter((t) => t.overdue).length} с прошлых дней` : `открыто всего ${open.length}` },
  ];

  return {
    meta: {
      takenAt: snapshot.takenAt,
      today,
      dateHuman: humanDate(today, { withWeekday: true }),
      weekStart: start,
      weekEnd: end,
      weekTitle: `Неделя ${humanDate(start)} — ${humanDate(end)}`,
    },
    today: {
      schedule: scheduleFor(manual, today),
      // Главное дня и всё остальное разведены нарочно. Шестнадцать строк
      // подряд не читаются за секунду, а решение «за что сесть сейчас»
      // принимается по первым трём. Ключевые помечены в Notion; если их там
      // не проставили, наверх идут самые просроченные.
      key: keyOfDay,
      rest: todayTasks.filter((t) => !keyOfDay.includes(t)),
      tasks: todayTasks,
      groups: groupByProject(todayTasks.filter((t) => !keyOfDay.includes(t))),
      overdue: todayTasks.filter((t) => t.overdue),
      habits: habitsToday,
      meetings: meetings.slice(0, 3),
      numbers,
    },
    week: {
      title: `Неделя ${humanDate(start)} — ${humanDate(end)}`,
      days: weekDays,
      habits: habitsWeek(snapshot.diary, manual, start, today),
      undated,
      later,
      planned: weekDays.reduce((s, d) => s + d.total, 0),
      done: weekDays.reduce((s, d) => s + d.done, 0),
      // Задача, у которой срок в прошлом внутри этой недели, а галочки нет:
      // именно она и переносится из недели в неделю.
      moved: weekDays.filter((d) => d.past).reduce((s, d) => s + d.tasks.filter((t) => !t.done).length, 0),
    },
    goals: goalsModel(snapshot.goals),
    debts,
    expect,
    links: manual.links || [],
    directions: snapshot.directions,
    projects: snapshot.projects,
    counts: {
      openTasks: open.length,
      projects: snapshot.projects.filter((p) => p.status === 'В работе' || p.status === 'Ждём ответа').length,
    },
  };
}

/**
 * Рисование экранов из модели. Чистые функции: модель на входе, строка HTML
 * на выходе — ни одного обращения к документу.
 *
 * Работает в двух местах сразу: в Node — на сборке и в проверках, в браузере —
 * когда страница получила свежие данные от шлюза и перерисовывает себя.
 * Поэтому здесь нет ни `window`, ни `document`, а сборка переносит файл
 * в страницу, срезав `export` (см. `inlineModule` в build.js).
 */


/** Видимый текст: типографика плюс экранирование. Для атрибутов не годится —
 *  неразрывный пробел в ссылке или в номере задачи её сломает. */
function txt(s) {
  return esc(fixText(s));
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ─────────────────────────── мелкие детали ─────────────────────────── */

function taskRow(t, { showDate = false, today = '' } = {}) {
  const cls = ['task'];
  if (t.done) cls.push('is-done');
  if (t.overdue) cls.push('is-overdue');
  if (t.key) cls.push('is-key');
  // Красным помечается только просроченный срок. Когда в красный уходила вся
  // приписка целиком, три ключевые задачи превращались в красный экран,
  // и «сгорело» переставало значить что-либо.
  const meta = [];
  if (t.project) meta.push(txt(t.project));
  if (t.overdue) meta.push(`<span class="task__late">${esc(relativeDay(t.date, today))}</span>`);
  else if (showDate && t.date) meta.push(esc(relativeDay(t.date, today)));
  if (t.note) meta.push(txt(t.note));
  return `<div class="${cls.join(' ')}" data-task="${esc(t.id)}" data-done="${t.done ? '1' : '0'}">
      <button class="task__box" type="button" aria-label="${t.done ? 'Снять отметку' : 'Отметить сделанным'}" aria-pressed="${t.done ? 'true' : 'false'}"></button>
      <span class="task__body">
        <span class="task__title">${txt(t.title)}</span>
        ${meta.length ? `<span class="task__meta">${meta.join(' · ')}</span>` : ''}
      </span>
    </div>`;
}

function tasksBlock(groups, opts) {
  if (!groups.length) return '';
  return groups.map((g) => `
    ${g.name ? `<p class="group">${txt(g.name)}</p>` : (groups.length > 1 ? '<p class="group">Остальное</p>' : '')}
    <div class="tasks">${g.items.map((t) => taskRow(t, opts)).join('')}</div>`).join('');
}

function habitsRow(habits) {
  return `<div class="habits" data-habits="${esc(habits.iso)}">
      ${habits.items.map((h) => `
        <button class="habit${h.done ? ' is-done' : ''}" type="button"
                data-habit="${esc(h.field)}" aria-pressed="${h.done ? 'true' : 'false'}"
                title="${esc(h.title)}">
          <span class="habit__short">${esc(h.short)}</span>
        </button>`).join('')}
    </div>`;
}

/* ─────────────────────────── сегодня ─────────────────────────── */

function renderToday(m) {
  const t = m.today;
  const tiles = t.numbers.map((n, i) => (i < 2
    ? `<div class="tile" data-tile="${esc(n.id)}">
        <span class="tile__label">${txt(n.label)}</span>
        <span class="tile__value">${esc(n.value)}</span>
        <span class="tile__note">${txt(n.note)}</span>
      </div>`
    : `<div class="tile tile--wide" data-tile="${esc(n.id)}">
        <span class="tile__side">
          <span class="tile__label">${txt(n.label)}</span>
          <span class="tile__note">${txt(n.note)}</span>
        </span>
        <span class="tile__value">${esc(n.value)}</span>
      </div>`)).join('');

  const schedule = t.schedule.length
    ? `<p class="h2">Распорядок дня</p>
       <div class="rows">${t.schedule.map((s) => `<div class="row row--plain"><span class="row__label">${txt(s)}</span></div>`).join('')}</div>`
    : '';

  const meetings = t.meetings.length
    ? `<p class="h2">Встречи</p>
       <div class="rows">${t.meetings.map((mt) => `
         <div class="row">
           <span class="row__label">${txt(mt.who)}${mt.topics ? `<span class="row__note">${txt(mt.topics)}</span>` : ''}</span>
           <span class="row__when">${esc(relativeDay(mt.date, m.meta.today))}</span>
         </div>`).join('')}</div>`
    : '';

  const main = t.key.length
    ? `<div class="tasks">${t.key.map((x) => taskRow(x, { today: m.meta.today })).join('')}</div>`
    : `<p class="empty">На сегодня задач не поставлено. Скажи ассистенту, что делаешь — он заведёт.</p>`;

  const rest = t.rest.length
    ? `<details class="fold"><summary>Остальные задачи дня <span class="fold__side">${t.rest.length}</span></summary>
        <div class="fold__body">${tasksBlock(t.groups, { today: m.meta.today })}</div>
       </details>`
    : '';

  // Соседние приложения ссылками: у Никиты их четыре, и прыгать между ними
  // через домашний экран дольше, чем нажать строку.
  const links = (m.links && m.links.length)
    ? `<p class="h2">Рядом</p>
       <div class="rows">${m.links.map((l) => `
         <a class="row row--link" href="${esc(l.url)}" target="_blank" rel="noopener">
           <span class="row__label">${txt(l.title)}<span class="row__note">${txt(l.note || '')}</span></span>
           <span class="row__when">открыть</span>
         </a>`).join('')}</div>`
    : '';

  const overdueNote = t.overdue.length
    ? `<p class="note">${t.overdue.length} ${plural(t.overdue.length, 'задача перенеслась', 'задачи перенеслись', 'задач перенеслось')} с прошлых дней — они помечены.</p>`
    : '';

  return `<section class="section is-active" id="today">
    <p class="daydate">${txt(m.meta.dateHuman)}</p>
    <div class="tiles">${tiles}</div>
    <p class="h2">Главное сегодня</p>
    ${main}
    ${rest}
    ${overdueNote}
    <p class="h2">Привычки сегодня <span class="h2__side">${t.habits.done} из ${t.habits.total}</span></p>
    ${habitsRow(t.habits)}
    ${schedule}
    ${meetings}
    ${links}
  </section>`;
}

/* ─────────────────────────── неделя ─────────────────────────── */

function renderWeek(m) {
  const w = m.week;

  const days = w.days.map((d) => {
    const cls = ['day'];
    if (d.isToday) cls.push('is-today');
    if (d.past) cls.push('is-past');
    const body = d.tasks.length
      ? `<div class="tasks">${d.tasks.map((t) => taskRow(t, { today: m.meta.today })).join('')}</div>`

          if (job.status === 'работаю') return;
          forgetJob(jobId);
          if (job.status === 'готово') showAnswer(job);
        })
        .catch(function () {});
    });
  }

  function showAnswer(job) {
    if (job.text) addMessage({ role: 'me', text: job.text, at: Date.now() });
    addMessage({ role: 'bot', text: job.reply || 'Готово', ops: job.ops || [], at: Date.now() });
    if (job.model) { data.model = job.model; draw(); }
  }

  /* ─────────────── переписка ─────────────── */

  var log = null;
  var chatState = null;

  function chatHistory() { return readStore(STORE_CHAT, []); }

  function addMessage(msg) {
    var history = chatHistory();
    history.push(msg);
    if (history.length > MAX_CHAT) history = history.slice(-MAX_CHAT);
    writeStore(STORE_CHAT, history);
    drawChat();
  }

  function timeOf(ts) {
    var d = new Date(ts);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  function drawChat() {
    log = document.getElementById('chat-log');
    if (!log) return;
    var history = chatHistory();
    if (!history.length) {
      log.innerHTML = '<p class="msg msg--sys">Скажи, что сделал или что нужно сделать — ассистент разложит по местам. Голосом тоже можно.</p>';
      return;
    }
    log.innerHTML = history.map(function (m) {
      var cls = 'msg msg--' + (m.role === 'me' ? 'me' : m.role === 'sys' ? 'sys' : 'bot');
      if (m.pending) cls += ' is-pending';
      var ops = (m.ops && m.ops.length)
        ? '<span class="msg__ops">' + m.ops.map(function (o) { return V.esc(o); }).join('<br>') + '</span>'
        : '';
      var time = m.role === 'sys' ? '' : '<span class="msg__time">' + timeOf(m.at) + (m.pending ? ' · уйдёт при связи' : '') + '</span>';
      return '<div class="' + cls + '">' + V.esc(m.text) + ops + time + '</div>';
    }).join('');
    scrollChat();
  }

  function scrollChat() {
    if (!log) return;
    window.requestAnimationFrame(function () {
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    });
  }

  function say(text) {
    if (!text.trim()) return;
    addMessage({ role: 'me', text: text, at: Date.now(), pending: !live });
    if (!live) {
      queue({ path: '/message', body: { text: text, at: Date.now() } });
      setLink('off', 'скажу, когда включишь');
      return;
    }
    busy = true;
    setLink('sending', 'думает');
    if (chatState) chatState.textContent = 'ассистент думает…';
    gateFetch('/message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text, at: Date.now() }),
      timeout: 30000,
    }).then(function (res) {
      rememberJob(res.job);
      return waitForJob(res.job).then(function (job) {
        forgetJob(res.job);
        showAnswer({ reply: job.reply, ops: job.ops, model: job.model });
        setLink('live', 'связь есть');
      });
    }).catch(function () {
      queue({ path: '/message', body: { text: text, at: Date.now() } });
      addMessage({ role: 'sys', text: 'Ассистент не ответил — сообщение уйдёт, когда компьютер проснётся.', at: Date.now() });
      setLink('off', 'компьютер спит');
    }).then(function () {
      busy = false;
      if (chatState) chatState.textContent = '';
    });
  }

  function wireChat() {
    var f = document.getElementById('chat-form');
    var i = document.getElementById('chat-input');
    var mic = document.getElementById('chat-mic');
    chatState = document.getElementById('chat-state');
    if (!f) return;
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var text = i.value;
      i.value = '';
      say(text);
    });
    if (mic) wireMic(mic);
  }

  /* ─────────────── голос ─────────────── */

  var recorder = null;
  var chunks = [];

  function wireMic(mic) {
    mic.addEventListener('click', function () {
      if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
      if (!navigator.mediaDevices || !window.MediaRecorder) {
        if (chatState) chatState.textContent = 'этот браузер не умеет записывать голос';
        return;
      }
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        chunks = [];
        recorder = new MediaRecorder(stream);
        recorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
        recorder.onstop = function () {
          stream.getTracks().forEach(function (t) { t.stop(); });
          mic.classList.remove('is-recording');
          sendVoice(new Blob(chunks, { type: recorder.mimeType || 'audio/webm' }));
        };
        recorder.start();
        mic.classList.add('is-recording');
        if (chatState) chatState.textContent = 'записываю — нажми ещё раз, чтобы отправить';
      }).catch(function () {
        if (chatState) chatState.textContent = 'нет доступа к микрофону';
      });
    });
  }

  function sendVoice(blob) {
    if (chatState) chatState.textContent = 'расшифровываю…';
    var reader = new FileReader();
    reader.onload = function () {
      var b64data = String(reader.result).split(',')[1];
      var item = { path: '/voice', body: { audio: b64data, type: blob.type, at: Date.now() } };
      if (!live) {
        addMessage({ role: 'me', text: '🎤 голосовое', at: Date.now(), pending: true });
        queue(item);
        if (chatState) chatState.textContent = '';
        setLink('off', 'скажу, когда включишь');
        return;
      }
      setLink('sending', 'слушает');
      gateFetch(item.path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(item.body),
        timeout: 60000,
      }).then(function (res) {
        rememberJob(res.job);
        return waitForJob(res.job).then(function (job) {
          forgetJob(res.job);
          showAnswer({ text: job.text || '🎤 голосовое', reply: job.reply, ops: job.ops, model: job.model });
          setLink('live', 'связь есть');
        });
      }).catch(function () {
        addMessage({ role: 'sys', text: 'Голосовое не дошло — попробую снова, когда будет связь.', at: Date.now() });
        queue(item);
        setLink('off', 'компьютер спит');
      }).then(function () {
        if (chatState) chatState.textContent = '';
      });
    };
    reader.readAsDataURL(blob);
  }

  /* ─────────────── повторная связь ─────────────── */

  // Экран открыли снова — проверяем компьютер: он мог проснуться, и тогда
  // всё, что копилось в очереди, уходит без единого действия руками.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && data && !busy) connect();
  });

  /* ─────────────── офлайн ─────────────── */

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();</script>
</body>
