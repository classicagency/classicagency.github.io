:root {
  --bg:          #0E0E0E;
  --surface-1:   #1A1A1D;
  --surface-2:   #1F1F22;
  --surface-3:   #2A2A2D;
  --line:        #2A2A2D;
  --line-soft:   #1F1F22;

  --ink:         #FFFFFF;
  --ink-2:       #ABABAB;
  --ink-3:       #5F5F5F;

  --accent:      #F8B815;
  --accent-ink:  #0E0E0E;
  --accent-soft: rgba(248, 184, 21, 0.12);
  --accent-line: rgba(248, 184, 21, 0.34);

  --down:        #EA4A3F;
  --down-soft:   rgba(234, 74, 63, 0.14);
  --down-line:   rgba(234, 74, 63, 0.38);

  --up:          #3FBF6F;

  --font-display: 'Manrope', system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body:    'Onest', system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num:     var(--font-display);

  --r-s: 10px;
  --r-m: 14px;
  --r-l: 20px;
  --tap: 44px;
  --pad: 16px;

  --t-tap:   180ms;
  --t-quick: 320ms;
  --t-move:  480ms;

  --ease: cubic-bezier(.4, .15, .2, 1);

  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  color-scheme: dark;
}

* { box-sizing: border-box; }

html {
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}

/* clip, а не hidden: hidden делает элемент контейнером прокрутки и ломает
   прилипание шапки — она уезжает вместе со страницей. */
html, body { overflow-x: clip; touch-action: manipulation; }

body {
  margin: 0;
  padding: 0 0 calc(64px + var(--safe-bottom));
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(248,184,21,0.05), transparent 60%),
    var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 400;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

::selection { background: var(--accent); color: var(--accent-ink); }
strong, b { font-weight: 500; }

.wrap { max-width: 720px; margin: 0 auto; padding: 0 var(--pad); }

/* ─────────────────────────── замок ─────────────────────────── */

/* Данные страницы лежат зашифрованными. До ввода пароля в документе нет
   ни одной цифры — ни в разметке, ни в памяти. */
.lock {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 24px;
  background: var(--bg);
  z-index: 50;
}
.lock__mark { color: var(--accent); }
.lock__title { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 0; }
.lock__hint { color: var(--ink-3); font-size: 14px; margin: 0; text-align: center; max-width: 280px; }
.lock__form { display: flex; gap: 8px; width: 100%; max-width: 320px; }
.lock__input {
  flex: 1;
  min-height: var(--tap);
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  background: var(--surface-1);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
}
.lock__input:focus { outline: none; border-color: var(--accent-line); }
.lock__btn {
  min-height: var(--tap);
  padding: 0 18px;
  border: 0;
  border-radius: var(--r-s);
  background: var(--accent);
  color: var(--accent-ink);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
}
.lock__error { color: var(--down); font-size: 14px; min-height: 20px; margin: 0; }
.lock[hidden] { display: none; }

/* ─────────────────────────── шапка ─────────────────────────── */

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  padding-top: var(--safe-top);
  background: rgba(14,14,14,0.92);
  backdrop-filter: saturate(140%) blur(12px);
  border-bottom: 1px solid var(--line-soft);
}
.topbar__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  max-width: 720px;
  margin: 0 auto;
  padding: 12px var(--pad) 10px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand__mark {
  display: grid;
  place-items: center;
  width: 34px; height: 34px;
  border-radius: var(--r-s);
  background: var(--accent-soft);
  color: var(--accent);
  overflow: hidden;
}
/* Аватарка занимает плитку целиком и обрезается кругом — так же, как
   в дневнике тренировок: три приложения обязаны читаться одним набором. */
.brand__mark:has(.brand__ava) { border-radius: 50%; background: none; }
.brand__ava { width: 100%; height: 100%; display: block; object-fit: cover; border-radius: 50%; }
.brand__title { display: block; font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.1; }
.brand__sub { display: block; color: var(--ink-3); font-size: 12px; }
.updated { color: var(--ink-3); font-size: 11px; text-align: right; line-height: 1.25; }

.tabs { max-width: 720px; margin: 0 auto; }
.tabs__scroll {
  display: flex;
  gap: 6px;
  padding: 0 var(--pad) 10px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs__scroll::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--ink-2);
  font-size: 14px;
  text-decoration: none;
  transition: color var(--t-tap) var(--ease), border-color var(--t-tap) var(--ease), background var(--t-tap) var(--ease);
}
.tab.is-active { background: var(--surface-3); border-color: var(--surface-3); color: var(--ink); }

/* ─────────────────────────── разделы ─────────────────────────── */

.section { display: none; padding-top: 18px; }
.section.is-active { display: block; animation: appear var(--t-move) var(--ease) both; }
@keyframes appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.h2 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 26px 0 10px;
}
.section > .h2:first-child { margin-top: 0; }

/* ── главные строки: то, ради чего экран открывают ── */

.rows { border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; background: var(--surface-1); }
.row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 14px;
  padding: 16px var(--pad);
  border-top: 1px solid var(--line-soft);
}
.row:first-child { border-top: 0; }
.row__label { font-size: 15px; color: var(--ink-2); }
.row__note { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.row__value {
  font-family: var(--font-num);
  font-weight: 600;
  font-size: 20px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
/* Строка с парой цифр справа: числа выравниваются по верху, а не по базовой
   линии — у пары своя подпись, и baseline увёл бы её вниз. */
/* Строка списка внутри карточки: кому и сколько, одной строкой и в один
   взгляд. Разделители те же, что у обычных строк, но сумма тише итоговой —
   иначе список спорит с цифрой, ради которой он открыт. */
.row--sub { padding: 11px var(--pad); }
.row--sub .row__label { font-size: 14px; }
.row--sub .row__value { font-size: 15px; color: var(--ink); }

.row--pair { align-items: flex-start; }
.row--lead { padding: 18px var(--pad); }
.row--lead .row__value { font-size: 26px; }
.row--accent .row__value { color: var(--accent); }
.row--down .row__value { color: var(--down); }
.row--muted .row__value { color: var(--ink-3); }

/* ── карточка тревоги: одна на экран, иначе перестаёт значить что-либо ── */

.alarm {
  margin-top: 12px;
  padding: 14px var(--pad);
  border: 1px solid var(--down-line);
  border-radius: var(--r-m);
  background: var(--down-soft);
}
.alarm__title { font-family: var(--font-display); font-weight: 600; font-size: 15px; margin: 0 0 4px; }
.alarm__text { margin: 0; font-size: 14px; color: var(--ink-2); }

.note { margin: 10px 2px 0; font-size: 13px; color: var(--ink-3); }

/* ── месяц ── */

.month {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  overflow: hidden;
}
.month__cell { background: var(--surface-1); padding: 16px var(--pad); }
/* Третья цифра встаёт полосой под парой: в три колонки числа ломались бы
   переносом, а места под ними хватает. */
.month__cell--wide { grid-column: 1 / -1; }
.month__label { display: block; font-size: 12px; color: var(--ink-3); margin-bottom: 4px; }
.month__value { display: block; font-family: var(--font-num); font-weight: 600; font-size: 24px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.month__note { display: block; font-size: 11px; color: var(--ink-3); margin-top: 4px; line-height: 1.3; }

/* ── та же пара цифр в строку: заголовок месяца, строка канала ── */

.pair { display: flex; gap: 16px; flex: 0 0 auto; }
.pair__cell { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.pair__cap { font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); }
.pair__val {
  font-family: var(--font-num);
  font-weight: 600;
  font-size: 16px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
}
/* Чистыми — то, ради чего экран открывают, поэтому она ярче оборотки. */
.pair__val--net { color: var(--ink); }

/* ── список дел с датами ── */

.plan { display: grid; gap: 8px; }
.plan__item {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 14px var(--pad);
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  background: var(--surface-1);
}
.plan__item.is-overdue { border-color: var(--down-line); background: var(--down-soft); }
.plan__title { font-size: 15px; }
.plan__when { display: block; font-size: 12px; color: var(--ink-3); margin-top: 3px; }
.plan__item.is-overdue .plan__when { color: var(--down); }
.plan__sum { font-family: var(--font-num); font-weight: 600; font-size: 18px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ── раскрывающиеся подробности ── */

details.fold {
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  background: var(--surface-1);
  margin-top: 8px;
  overflow: hidden;
}
details.fold + details.fold { margin-top: 8px; }
.fold > summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: var(--tap);
  padding: 12px var(--pad);
  cursor: pointer;
  list-style: none;
  font-size: 15px;
}
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::after {
  content: '';
  width: 8px; height: 8px;
  border-right: 1.5px solid var(--ink-3);
  border-bottom: 1.5px solid var(--ink-3);
  transform: rotate(45deg) translate(-2px, -2px);
  transition: transform var(--t-quick) var(--ease);
  flex: 0 0 auto;
}
.fold[open] > summary::after { transform: rotate(-135deg) translate(-2px, -2px); }
.fold__sum { margin-left: auto; margin-right: 10px; font-family: var(--font-num); font-weight: 600; font-variant-numeric: tabular-nums; }
.fold__body { padding: 2px var(--pad) 14px; border-top: 1px solid var(--line-soft); }

/* Заголовок месяца: название и под ним две цифры. В строку они на узком
   экране не помещаются, а сокращать числа нельзя — их читают. */
.fold__head { display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; min-width: 0; }
.fold__title { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.fold__head .pair { justify-content: flex-start; gap: 28px; }
.fold__head .pair__cell { align-items: flex-start; }

/* ── лента операций ── */

/* Лента поступлений живёт и внутри раскрытого месяца, и на главном экране,
   где ей нужна своя рамка. */
.oplist {
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  background: var(--surface-1);
  padding: 4px var(--pad) 8px;
}

.op {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 0;
  border-top: 1px solid var(--line-soft);
}
.op:first-child { border-top: 0; }
.op__what { font-size: 14px; min-width: 0; }
.op__meta { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
/* Разложение платежа: куда ушла сумма и сколько осталось. Без него
   число в правой колонке говорит не то, что кажется. */
.op__calc { display: block; font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.op__net { font-weight: 500; color: var(--ink); white-space: nowrap; }
.op__sum { font-family: var(--font-num); font-weight: 600; font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.op__sum.is-transit { color: var(--ink-3); }

.tag {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 7px;
  border-radius: 999px;
  border: 1px solid var(--line);
  font-size: 11px;
  color: var(--ink-3);
  vertical-align: middle;
}
.tag--transit { border-color: var(--accent-line); color: var(--accent); }

/* ── полоса долей ── */

.bar { display: flex; height: 6px; border-radius: 999px; overflow: hidden; background: var(--surface-3); margin: 10px 0 14px; }
.bar__part { height: 100%; }

/* ── таблица ── */

.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th, table.t td { padding: 10px 8px; text-align: right; border-top: 1px solid var(--line-soft); white-space: nowrap; }
table.t th:first-child, table.t td:first-child { text-align: left; white-space: normal; }
table.t th { color: var(--ink-3); font-weight: 400; font-size: 12px; border-top: 0; }
table.t td.num { font-family: var(--font-num); font-weight: 600; font-variant-numeric: tabular-nums; }
table.t tr.is-total td { border-top: 1px solid var(--line); color: var(--ink); }
/* Что это был за проект — второй строкой и вполголоса: строка находится
   по имени, а приписка читается только когда она понадобилась. */
.t__note { display: block; font-size: 11px; color: var(--ink-3); line-height: 1.3; margin-top: 2px; }

.foot { margin: 34px 0 10px; color: var(--ink-3); font-size: 13px; }
.foot p { margin: 0 0 8px; }

@media (min-width: 560px) {
  .row__value { font-size: 22px; }
  .row--lead .row__value { font-size: 30px; }
}
</style>
</head>

<script>(function () {
  'use strict';

  var STORE = 'nk-money-key-v1';
  var box = window.__BOX__;
  var lock = document.getElementById('lock');
  var input = document.getElementById('lock-input');
  var form = document.getElementById('lock-form');
  var errorEl = document.getElementById('lock-error');
  var app = document.getElementById('app');

  function b64(str) {
    var bin = atob(str);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function decrypt(password) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64(box.salt), iterations: box.iterations, hash: 'SHA-256' },
          base,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(box.iv) }, key, b64(box.data));
      })
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }

  function boot(html) {
    app.innerHTML = html;
    lock.setAttribute('hidden', '');
    document.body.classList.add('is-open');
    wireTabs();
    var start = (location.hash || '').replace('#', '');
    if (start && document.getElementById(start)) show(start);
  }

  function tryPassword(password, remember) {
    return decrypt(password).then(function (html) {
      if (remember) { try { localStorage.setItem(STORE, password); } catch (e) {} }
      boot(html);
      return true;
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorEl.textContent = '';
    var value = input.value;
    if (!value) return;
    form.querySelector('button').disabled = true;
    tryPassword(value, true).catch(function () {
      errorEl.textContent = 'Пароль не подходит';
      input.value = '';
      form.querySelector('button').disabled = false;
      input.focus();
    });
  });

  var saved = null;
  try { saved = localStorage.getItem(STORE); } catch (e) {}
  if (saved) {
    tryPassword(saved, false).catch(function () {
      try { localStorage.removeItem(STORE); } catch (e) {}
      input.focus();
    });
  }

  /* ─────────────── вкладки ─────────────── */

  var tabs = [];
  var sections = [];

  function show(id) {
    sections.forEach(function (s) { s.classList.toggle('is-active', s.id === id); });
    tabs.forEach(function (t) { t.classList.toggle('is-active', t.getAttribute('data-tab') === id); });
    if (history.replaceState) history.replaceState(null, '', '#' + id);
  }

  function wireTabs() {
    tabs = [].slice.call(document.querySelectorAll('[data-tab]'));
    sections = [].slice.call(document.querySelectorAll('.section'));
    tabs.forEach(function (t) {
      t.addEventListener('click', function (e) {
        e.preventDefault();
        show(t.getAttribute('data-tab'));
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
    var forget = document.getElementById('forget');
    if (forget) {
      forget.addEventListener('click', function (e) {
        e.preventDefault();
        try { localStorage.removeItem(STORE); } catch (err) {}
        location.reload();
      });
    }
  }

  /* ─────────────── офлайн ─────────────── */

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();</script>
